- name: brands
  label: Authorized brands
  type: file
  path: content/brands.json
  format: json
  list: true
  fields:
  - name: name
    label: Brand name
    type: string
    required: true
  - name: slug
    label: Unique URL slug (lowercase letters, digits and hyphens)
    type: string
    required: true
    pattern: ^[a-z0-9-]+$
  - name: published
    label: Show publicly (only after representation is authorized)
    type: boolean
  - name: category
    label: Category
    type: string
  - name: summary
    label: Short summary
    type: text
  - name: description
    label: Detailed brand description
    type: text
  - name: logo
    label: Brand logo (use only with permission)
    type: image
  - name: image
    label: Product or brand image (use only with permission)
    type: image
